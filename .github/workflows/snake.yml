name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation (dark)
        uses: Platane/snk@v3
        with:
          github_user_name: BivinSG
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff00ff,#00ffff,#39ff14,#ffae00

      - name: Generate snake animation (light)
        uses: Platane/snk@v3
        with:
          github_user_name: BivinSG
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#ff007f,#00bfff,#7cfc00,#ffd700

      - name: Push snake files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
