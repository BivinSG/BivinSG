name: Generate Cyberpunk Snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Cyberpunk Snake (Dark Mode with Particles)
        uses: Platane/snk@v3
        with:
          github_user_name: BivinSG
          outputs: |
            dist/github-contribution-grid-snake-cyberpunk-dark.svg?
            palette=github-dark&
            color_snake=#ff00ff,#00ffff,#39ff14,#ffae00&
            snake_width=4&
            speed=6&
            size=6&
            particle_color=#00f5ff&
            particle_count=40&
            background_color=transparent

      - name: Generate Cyberpunk Snake (Light Mode with Particles)
        uses: Platane/snk@v3
        with:
          github_user_name: BivinSG
          outputs: |
            dist/github-contribution-grid-snake-cyberpunk.svg?
            palette=github-light&
            color_snake=#ff007f,#00bfff,#7cfc00,#ffd700&
            snake_width=4&
            speed=6&
            size=6&
            particle_color=#ff00ff&
            particle_count=40&
            background_color=transparent

      - name: Push Output to Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
